name: Update GitHub Trophies

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - ".github/workflows/trophy.yml"
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-trophy
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate trophy SVG
        uses: soulteary/github-profile-trophy-action@v1.0.0
        with:
          options: "username=${{ github.repository_owner }}&theme=onedark&column=6&row=2&margin-w=10&margin-h=10&no-frame=true"
          path: .github/assets/trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          version: v1.0.0

      - name: Commit refreshed trophy board
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/assets/trophy.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore(profile): refresh GitHub trophies"
          git push
