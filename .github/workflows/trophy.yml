name: Update GitHub Trophies

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - ".github/workflows/trophy.yml"
      - "scripts/update_trophy_board.py"
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-trophy
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate repo-native trophy SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TROPHY_OUTPUT: .github/assets/trophy.svg
        run: python3 scripts/update_trophy_board.py

      - name: Commit refreshed trophy board
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/assets/trophy.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore(profile): refresh GitHub trophies"
          git push
